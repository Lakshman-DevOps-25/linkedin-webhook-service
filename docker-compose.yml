# Local infrastructure for the webhook-only archiver: MongoDB only.
# (No Redis — there is no poller/queue in this build.)
# Media uses the local filesystem driver by default.
#
#   docker compose up -d
#   npm start
#   docker compose down        # add -v to also wipe data
services:
  mongo:
    image: mongo:7
    container_name: law-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
